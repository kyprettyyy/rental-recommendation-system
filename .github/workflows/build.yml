name: Compile curated sources
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, streaming]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn -B -f ${{ matrix.module }}/pom.xml package -DskipTests
